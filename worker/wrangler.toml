# ตัวอย่าง config ของ Cloudflare Worker ตรวจสลิป
# ใช้คู่กับ worker/slip-verify.js — วิธี deploy ดูที่ worker/README.md
#
# รันคำสั่งทั้งหมดจากในโฟลเดอร์ worker/ นี้
#   wrangler deploy

name = "slip-verify"
main = "slip-verify.js"

# วันที่ของ runtime ที่จะใช้ ตั้งไว้เท่าวันที่สร้าง Worker แล้วอย่าเปลี่ยนพร่ำเพรื่อ
# เปลี่ยนแล้วพฤติกรรมบางอย่างของ runtime อาจต่างไป
compatibility_date = "2026-07-01"

[vars]
# ผู้ให้บริการที่จะใช้ — ตอนนี้รองรับ "easyslip" | "slipok" | "thunder"
PROVIDER = "thunder"

# โดเมนที่อนุญาตให้เรียก Worker นี้ ใส่หลายอันได้คั่นด้วยจุลภาค
#
# !! ห้ามปล่อยเป็น "*" ตอนใช้จริง !!
# ปล่อยไว้แปลว่าเว็บไหนก็เรียก Worker เราได้ = เอาโควตาที่เราจ่ายไปใช้ฟรี
#
# ใส่เป็น origin เต็มๆ ไม่มี / ปิดท้าย
# localhost ใส่ไว้ด้วยเพื่อให้ทดสอบตอน next dev ได้
ALLOWED_ORIGIN = "https://phawit-s.github.io,http://localhost:3000"

# จำกัดจำนวนคำขอต่อ IP ต่อนาที (ลบบรรทัดนี้ = ไม่จำกัด)
# นับในหน่วยความจำของแต่ละ instance จึงเป็นแค่การกันยิงรัวๆ ไม่ใช่โควตาที่แม่นยำ
MAX_PER_MIN = "30"

# เฉพาะ PROVIDER = "slipok" เท่านั้น — รหัสสาขาที่ได้จากหน้าจัดการของ SlipOK
# BRANCH_ID = "12345"

# ------------------------------------------------------------------
# API_KEY ต้องไม่อยู่ในไฟล์นี้เด็ดขาด เพราะไฟล์นี้ถูก commit ขึ้น git
# ให้เก็บเป็น secret แทน แล้วมันจะโผล่ใน env.API_KEY เองตอนรัน
#
#   wrangler secret put API_KEY
#
# (พิมพ์คีย์ตอนที่มันถาม ค่าที่ใส่จะไม่ถูกบันทึกลงไฟล์ใดๆ)
# ------------------------------------------------------------------
