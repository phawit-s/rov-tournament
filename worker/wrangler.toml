# ตัวอย่าง config ของ Cloudflare Worker ตรวจสลิป
# ใช้คู่กับ worker/slip-verify.js — วิธี deploy ดูที่ worker/README.md
#
# รันคำสั่งทั้งหมดจากในโฟลเดอร์ worker/ นี้
#   wrangler deploy

name = "slip-verify"
main = "slip-verify.js"

# วันที่ของ runtime ที่จะใช้ ตั้งไว้เท่าวันที่สร้าง Worker แล้วอย่าเปลี่ยนพร่ำเพรื่อ
# เปลี่ยนแล้วพฤติกรรมบางอย่างของ runtime อาจต่างไป
compatibility_date = "2026-07-01"

[vars]
# ผู้ให้บริการที่จะใช้ — ตอนนี้รองรับ "easyslip" | "slipok" | "thunder"
PROVIDER = "thunder"

# โปรเจกต์ Firebase ที่ Worker จะเขียนสถานะใบลงไป (ไม่ใช่ความลับ)
# ต้องมีคู่กับ BOT_EMAIL / BOT_PASSWORD / FIREBASE_API_KEY ถึงจะอนุมัติเองได้
FIREBASE_PROJECT = "rov-tournament"

# โดเมนที่อนุญาตให้เรียก Worker นี้ ใส่หลายอันได้คั่นด้วยจุลภาค
#
# !! ห้ามปล่อยเป็น "*" ตอนใช้จริง !!
# ปล่อยไว้แปลว่าเว็บไหนก็เรียก Worker เราได้ = เอาโควตาที่เราจ่ายไปใช้ฟรี
#
# ใส่เป็น origin เต็มๆ ไม่มี / ปิดท้าย
# localhost ใส่ไว้ด้วยเพื่อให้ทดสอบตอน next dev ได้
ALLOWED_ORIGIN = "https://phawit-s.github.io,http://localhost:3000"

# จำกัดจำนวนคำขอต่อ IP ต่อนาที (ลบบรรทัดนี้ = ไม่จำกัด)
# นับในหน่วยความจำของแต่ละ instance จึงเป็นแค่การกันยิงรัวๆ ไม่ใช่โควตาที่แม่นยำ
MAX_PER_MIN = "30"

# เฉพาะ PROVIDER = "slipok" เท่านั้น — รหัสสาขาที่ได้จากหน้าจัดการของ SlipOK
# BRANCH_ID = "12345"

# ------------------------------------------------------------------
# API_KEY ต้องไม่อยู่ในไฟล์นี้เด็ดขาด เพราะไฟล์นี้ถูก commit ขึ้น git
# ให้เก็บเป็น secret แทน แล้วมันจะโผล่ใน env.API_KEY เองตอนรัน
#
#   wrangler secret put API_KEY
#
# (พิมพ์คีย์ตอนที่มันถาม ค่าที่ใส่จะไม่ถูกบันทึกลงไฟล์ใดๆ)
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# อนุมัติใบให้เองหลังตรวจสลิปผ่าน (ไม่ตั้งก็ได้ แค่ผู้จัดต้องกดอนุมัติเอง)
#
# ทำไมต้องมี: เว็บเป็น static ถ้าให้เบราว์เซอร์ของผู้จัดเป็นคนอนุมัติ
# มันจะทำงานเฉพาะตอนเปิดหน้าตั้งค่าค้างไว้ ซึ่งตอนไลฟ์จริงไม่มีใครเปิด
#
# วิธีตั้ง
#   1. สร้างบัญชีอีเมล/รหัสผ่านหนึ่งบัญชีในเว็บ (สมัครบัญชีใหม่) ไว้ให้ Worker ใช้
#   2. เอา uid ของบัญชีนั้นไปใส่ในหน้า ช่อง -> ผู้ดูแลระบบ
#      (กติกาเดิมจะปล่อยให้มันแก้ใบโดเนทของทุกช่องได้เอง)
#   3. ใส่ความลับสามตัวนี้
#        wrangler secret put BOT_EMAIL
#        wrangler secret put BOT_PASSWORD
#        wrangler secret put FIREBASE_API_KEY
#   4. ใส่ชื่อโปรเจกต์ Firebase ที่ [vars] ด้านบน (ไม่ใช่ความลับ)
#      ขาดตัวนี้ตัวเดียว Worker จะข้ามการอนุมัติทั้งหมดโดยไม่มีอะไรฟ้อง
#
# ระวัง: บัญชีบอทมีสิทธิ์ผู้ดูแล ใครได้รหัสผ่านไปก็ได้สิทธิ์ตามไปด้วย
# ตั้งรหัสยาวๆ และอย่าเอาไปใช้ล็อกอินเว็บเอง
# ------------------------------------------------------------------
# ------------------------------------------------------------------
# รับคำขอเพลงจากแชทไลฟ์ TikTok (ไม่ตั้งก็ได้ — ไม่ตั้ง = ปิดทางนี้ไว้)
#
# ใช้คู่กับสะพานในโฟลเดอร์ bridge/ ที่รันบนเครื่องสตรีมเมอร์
# ใช้บัญชีบอทตัวเดียวกับการอนุมัติสลิปด้านบน จึงต้องตั้งอันนั้นให้ครบก่อน
#
#   wrangler secret put INGEST_TOKEN
#
# ตั้งเป็นสตริงสุ่มยาวๆ ตัวเดียวกับที่ใส่ในไฟล์ .env ของสะพาน
# สุ่มด้วย:  node -e "console.log(crypto.randomUUID().replace(/-/g,''))"
#
# ใครได้ token นี้ไปก็ยัดเพลงเข้าคิวช่องเราได้ (แต่ทำอย่างอื่นไม่ได้)
# ------------------------------------------------------------------

# เพดานคำขอเพลงจากแชท — นับต่อช่องต่อนาที และต่อคนต่อนาที
# ค่าเริ่มต้นถ้าไม่ใส่คือ 20 และ 2
MAX_INGEST_PER_MIN = "20"
MAX_INGEST_PER_USER_MIN = "2"

# ------------------------------------------------------------------
# แคชผลค้นหาข้าม instance (ไม่ผูกก็ทำงานได้ แค่กินโควตา YouTube มากขึ้น)
#
# โควตาฟรีของ YouTube Data API ค้นได้ราววันละ 100 ครั้งเท่านั้น
# ซึ่งหมดเร็วมากถ้าคนในไลฟ์พิมพ์ชื่อเพลงกันรัวๆ แคชช่วยตรงที่คนขอเพลงฮิต
# ซ้ำกันเยอะ — ผูก KV แล้วผลค้นจะอยู่ข้ามการรีสตาร์ทและข้าม instance ด้วย
#
#   wrangler kv namespace create SONG_CACHE
# แล้วเอา id ที่ได้มาใส่ตรงนี้
#
# [[kv_namespaces]]
# binding = "SONG_CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# ------------------------------------------------------------------
